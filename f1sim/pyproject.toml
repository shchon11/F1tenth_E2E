[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "f1sim"
version = "0.1.0"
description = "GPU-vectorized F1TENTH simulator for RL/IL e2e planner training (Hokuyo 2D LiDAR, VESC)"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "scipy", "scikit-image", "pyyaml", "pillow", "matplotlib", "websockets"]

[project.optional-dependencies]
gym = ["gymnasium>=0.29"]
dev = ["pytest"]
learn = ["wandb"]
viewer = ["moderngl", "glfw", "trimesh"]

[tool.setuptools.packages.find]
include = ["f1sim*"]

[tool.setuptools.package-data]
f1sim = ["assets/*.glb", "assets/*.npz", "assets/maps/*.pgm", "assets/maps/*.yaml",
         "viewer/static/*.html", "viewer/static/*.js", "viewer/static/three/*.js",
         "viewer/static/three/addons/*/*.js",
         # tests/benchmark/test_frozen_placement.py resolves this through the imported package,
         # not a repo path, so it has to be in the wheel for an installed benchmark to work.
         "learn/benchmark/*.json"]
