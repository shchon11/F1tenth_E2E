  - 20260826-194519
  - 20260826-194702
  - 20260827-111616
  - 20260827-115713
  structure: (c2*)
  final_check: 'REPORT.md section 2: 1 s yaw 0.136 vs (a) 0.147, 2 s position 0.45 vs 0.46 m, spin 0 % vs nominal 13 %'
vehicle:
  mu:
    value: 1.35
    unit: '-'
    source: estimated
    status: measured
    err:
    - 1.1
    - 1.7
    tier: place
    how: peak friction of the rear axle (front = mu_f_scale x mu); see REPORT.md section 4 / 6
    note: '뒤 최대 마찰: profile 1.1~1.7 (C 1.3 모양 가정 아래); 공통 μ 하한 1.15'
  mu_ref:
    value: 1.35
    unit: '-'
    source: estimated
    status: measured
    tier: place
    how: = mu, so B is the raw stiffness factor and randomising mu moves only the peak (mu_stiffness_exp 0)
  mu_f_scale:
    value: 1.04
    unit: '-'
    source: estimated
    status: lower_bound
    tier: place
    how: front peak 1.4 = lower bound of its profile (C 1.3), rear 1.35 inside 1.1-1.7
    note: 앞 최대 마찰은 하한(1.4)만 나옴; 비율 1.04 = 앞이 아주 조금 늦게 포화
  B_f:
    value: 2.085833
    unit: 1/rad
    source: estimated
    status: measured
    err:
    - 1.753568
    - 2.454995
    tier: place
    how: 'front slope mu*scale*B*C = 3.81/rad from the competition (c2*) fit, kept; interval: (b'') sf profile ratio'
    note: 앞 강성(조향 컴플라이언스 포함). 사전 장소 bag으로는 대회장 값과 구분 안 됨
  B_r:
    value: 4.039074
    unit: 1/rad
    source: estimated
    status: measured
    err:
    - 3.287308
    - 5.259693
    tier: place
    how: 'rear slope mu*B*C = 7.09/rad from the competition (c2*) fit, kept; interval: (b'') sr profile ratio'
  h:
    value: 0.0
    unit: m
    source: estimated
    status: measured
    tier: structure
    how: (d) and (c1) (longitudinal load transfer with linear-in-load tyres) predicted WORSE than (b)/(c2) on val and final
    note: 실제 무게중심 높이(0.074)가 아니라 '종방향 하중 이동을 끄는' 실효값. 시뮬에서 h는 하중 이동·IMU 레버암·접촉 모멘트에만 쓰임
  contact_z_end:
    value: -0.043
    unit: m
    source: assumed
    status: measured
    tier: structure
    how: shifted with h so the contact pitch moment (h - contact_z_end) is unchanged
    note: 접촉 모멘트 보존용 이동
  contact_z_side:
    value: -0.014
    unit: m
    source: assumed
    status: measured
    tier: structure
    how: shifted with h so the contact roll moment (h - contact_z_side) is unchanged
    note: 접촉 모멘트 보존용 이동
  C_f:
    value: 1.3
    unit: '-'
    source: assumed
    status: not_identified
    tier: structure
    how: C 1.0 / 1.3 / free(1.0-2.2) fit equally on val and final
    note: 교과서 횡방향 값. 모양은 레이스 bag으로 구분 안 됨
  C_r:
    value: 1.3
    unit: '-'
    source: assumed
    status: not_identified
    tier: structure
    how: same
  E_f:
    value: 0.0
    unit: '-'
    source: assumed
    status: not_identified
    tier: structure
  E_r:
    value: 0.0
    unit: '-'
    source: assumed
    status: not_identified
    tier: structure
  a_max:
    value: 5.604184
    unit: m/s^2
    source: estimated
    status: measured
    tier: car
    how: (c2) speed-replay fit with v_switch 7.0
    note: 전류 한계 구간 직접 측정 중앙값 4.67 (bag 8개)
  a_brake:
    value: 5.0
    unit: m/s^2
    source: measured
    status: measured
    err:
    - 4.59774
    - 5.007417
    tier: car
    how: 'regen-limited braking (current <= 90 % of -30 A), bag_profile per bag: median 4.85 over 7 bags'
    note: 시뮬 기본값 5.0 유지(11-09 최강 200 ms 측정); bag별 중앙값은 5.0보다 낮음 -> err 범위로 표시
  m:
    value: 3.74
    unit: kg
    source: spec
    status: not_identified
    tier: geometry
    how: f1tenth_gym default; the bags see forces per unit mass only
    note: 저울로 잴 것 (필요할 때 잴 목록)
    apply: false
  Iz:
    value: 0.04712
    unit: kg m^2
    source: spec
    status: not_identified
    err:
    - 0.028272
    - 0.07068
    tier: geometry
    how: 'Iz/m x0.6: train error +8.7 %, x1.5: -6.0 % (servo_tau absorbs it)'
    note: 데이터는 1.5배 쪽을 약간 선호하나 서보 지연과 맞바뀜
    apply: false
  lf:
    value: 0.15875
    unit: m
    source: spec
    status: not_identified
    tier: geometry
    how: lr +-0.02 m changes the train error by < 0.3 %
    note: '무게중심 앞뒤 위치: 바퀴별 저울로 잴 것'
    apply: false
  lr:
    value: 0.17145
    unit: m
    source: spec
    status: not_identified
    tier: geometry
    how: same
    apply: false
  c_roll:
    value: 0.1
    unit: m/s^2
    source: assumed
    status: not_identified
    tier: place
    how: no coast-down in any bag
    note: 코스트다운 T4로 잴 것
    apply: false
  c_drag:
    value: 0.01
    unit: 1/m
    source: assumed
    status: not_identified
    tier: place
    how: same
    apply: false
