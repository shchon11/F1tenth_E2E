# Every parameter of the policy/controller graph, in one file.
#
# The three launch files -- graph_sim, graph_console, graph_car -- differ ONLY in where the sensor
# topics come from. Everything that can change what the car does is here, so "which arm was in
# force, at what friction, with what calibration" is one file to read and one file to diff, and a
# sim run and a car run are the same run with a different sensor source.
#
# Override from the launch line:  ros2 launch f1sim_ros graph_sim.launch.py \
#     checkpoint:=$HOME/f1sim_runs/ppo_race_0910/ppo_latest.pt controller:=fixed_low+clearance
# or point `config_yaml:=` at a copy of this file.

/**/f1sim_policy:
  ros__parameters:
    # --- what drives ---------------------------------------------------------
    checkpoint: ""            # absolute path to the exported actor; required
    device: "cpu"             # "cuda" on a machine with one (the car's Jetson AGX Orin has one). Set it with the
                              # launch argument `device:=cuda`: the launch's own default (cpu) is laid over this file
    # The speed ceiling the POLICY is told about: it is an observation channel, so it changes what
    # the network emits, not just what the tracker allows. It has to match the controller's
    # `speed_cap` below -- `system_check` reports both and says so when they differ.
    speed_cap: 4.0
    # The grip dial, for a checkpoint trained with one (meta cond source "dial" -- e.g.
    # iccas_bootcamp_safest.pt). REQUIRED by such a checkpoint: the node refuses to start without
    # it (NaN = unset) rather than assume a friction. Ignored by an unconditional checkpoint.
    # It is the friction the policy is TOLD to use, in the simulator's mu units (`P["mu"]`: nominal
    # floor 1.0489, training range 0.73423..1.15379). Training told it mu - U(0, 0.30), exact in
    # 30 % of episodes (`--dial-margin 0.30 --dial-exact 0.30`), so a dial at or a little under the
    # floor's real grip is in distribution; the evaluation tables are scored at dial = true mu
    # (`--dial-offset 0.0`). Above the real grip is the dangerous side (1 -> 13 collisions/km at +0.4).
    # 0.73423 is the bottom of the training friction range (`grip_estimator.MU_MIN`), the console's
    # default dial and the controller's `fixed_low` grip_mu below: never above any floor the policy
    # trained on. Against the simulator's nominal floor (mu 1.0489, the floor docs/real_data_calibration.md
    # compares the real car with -- mu itself was never fitted to the car) that is a margin of 0.31, just
    # past the trained 0.30 -- slower than the policy can go, not unsafe.
    # SET THIS PER VENUE: once the track's mu is measured, use it (dial-offset 0), or a little under --
    # here, or with the launch argument `dial:=<mu>`, which is laid over this file when given.
    # Read-only once the node is up (`ros2 param set` is refused): change it by restarting the node.
    dial: 0.73423
    dial_override: ""        # filled by the launch argument `dial:=<mu>`; leave empty here

    # --- topics --------------------------------------------------------------
    plan_topic: "/f1sim/plan"
    state_topic: "/f1sim/policy_state"
    # What this node worked out about the scan it planned from -- the front-end's per-beam floor
    # class and the attitude the observation was built with. Diagnostic unless the controller's
    # clearance arm has its floor gate on, and optional even then.
    perception_topic: "/f1sim/policy/perception"
    reset_topic: "/f1sim/reset"
    drive_topic: "drive"      # used ONLY by a direct-action checkpoint, which has no plan
    enabled: true

    # --- sensors -------------------------------------------------------------
    sensor_timeout: 0.25      # s; older than this on any actor input and the policy stops planning
    imu_accel_scale: 0.0      # 0 = detect g vs m/s^2 from the first gravity vector
    steer_max: 0.4189         # direct-action checkpoints only
    # Where the POLICY's roll/pitch observation columns come from: "vesc" (the orientation
    # quaternion, which every trained checkpoint saw), "ego" (floor.EgoStateAttitude, measured
    # 6x better while driving) or "frontend" (a checkpoint that declares one). Changing it
    # changes two of the policy's inputs -- see docs/research/floor-mask-2026-09-15.md.
    attitude_source: "vesc"

/**/f1sim_controller:
  ros__parameters:
    # --- the arm -------------------------------------------------------------
    # legacy | fixed_low | clearance | fixed_low+clearance. Anything else -- the simulator's
    # oracle / estimated / +tcs arms -- is refused rather than silently downgraded.
    controller: "fixed_low"
    grip_mu: 0.0              # 0 = the module default, MU_FIXED_LOW = 0.73423
    clearance_margin: 0.0     # 0 = the module default, 0.20 m body edge
    # The floor-aware occupancy: a return the geometry (or the policy's front-end) says is the
    # FLOOR is left out of the grid. OFF by default, and off the grid is bit-identical to the arm
    # that shipped. `_mode` is which decision it may touch when it is on -- "brake" (the measured
    # default: the speed cap only) or "both".
    clearance_floor_gate: false
    clearance_floor_gate_mode: "brake"
    traction: "off"           # "on" installs the replay-validated guard; see docs/ros2.md
    traction_params: ""       # NAME=VALUE pairs overriding any TractionParams field

    # --- the tracker ---------------------------------------------------------
    device: "cpu"
    speed_cap: 4.0            # must equal the policy's
    steer_max: 0.4189
    wheelbase: 0.3302
    cmd_delay: 0.035          # s, the measured command latency this car's tracker predicts over
    # The "profile" speed command only (a checkpoint's plan-output contract): the VESC speed loop's
    # time constant it inverts, and the control period each command is held for.
    motor_tau: 0.2            # s
    control_dt: 0.025         # s
    steer_bias: 0.0           # rad; published angle = (cmd - steer_bias) / steer_gain
    steer_gain: 1.0           # LEAVE AT 1.0 until the servo configuration is confirmed: the two
    speed_gain: 1.0           # recorded configurations have OPPOSITE polarity (docs/ros2.md)

    # --- the observation geometry the clearance grid is built on -------------
    # Read from the checkpoint when it is given, which is the only way it is guaranteed to be the
    # policy's. n_beams / range_max / v_max are for a controller with no checkpoint on this disk
    # (a baseline node, a replay); giving both and disagreeing is refused.
    checkpoint: ""
    n_beams: 0
    range_max: 0.0
    v_max: 0.0

    # --- topics and timeouts -------------------------------------------------
    plan_topic: "/f1sim/plan"
    perception_topic: "/f1sim/policy/perception"
    drive_topic: "drive"
    diag_topic: "/f1sim/controller/diag"
    reset_topic: "/f1sim/reset"
    enabled: true
    sensor_timeout: 0.25      # the monolithic node's rule, unchanged: stale sensors -> zero speed
    plan_timeout: 0.25        # s without a plan before the car is braked to zero
    watchdog_period: 0.01     # s; how often the two timeouts above are checked
    viz: false                # /f1sim/viz/plan and /f1sim/viz/clearance markers for rviz

/**/f1sim_system_check:
  ros__parameters:
    # WHICH topics and at what rate is `config/record.yaml`, not this file: the checker and the
    # recorder have to agree about what the graph needs, and two lists would not.
    profile: ""               # "" = config/record.yaml
    period: 1.0               # s between reports
    window_s: 5.0             # s of arrivals each rate is measured over
    rate_tolerance: 0.5       # fraction of the profile's rate below which a topic is "slow"
    rate_ceiling: 1.5         # multiple of it above which a topic is "fast" -- /drive above its
                              # nominal rate is the controller braking between plans
    stale_after: 0.5          # s without a message before a topic is "stale"
    once: false               # true: report once and exit non-zero if anything required is missing
    car: false                # true: drop the simulator-only topics before checking
