<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>A 레이스 준비</title>
<link rel="stylesheet" href="assets/base.css"><style>
body{background:#0e0f11;color:#f4f4f1}
.bg{position:absolute;inset:0;width:1920px;height:1200px}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,10,12,.88) 0,rgba(9,10,12,.6) 30%,rgba(9,10,12,0) 56%)}
.title{left:96px;top:150px;font-size:64px;font-weight:800}
.rows{left:60px;top:280px;width:636px}
.row{display:flex;align-items:center;justify-content:space-between;height:92px;padding:0 36px;border-radius:10px;margin-bottom:6px}
.row label{font-size:28px;font-weight:500;color:rgba(244,244,241,.6)}
.row b{font-size:34px;font-weight:700}
.row.on{background:rgba(244,244,241,.16);box-shadow:inset 0 0 0 3px #f4f4f1}
.row.on label{color:#f4f4f1}
.row.on b{display:flex;align-items:center;gap:22px}
.row.on b:before,.row.on b:after{content:"";width:13px;height:13px;border:solid #f4f4f1;border-width:0 0 4px 4px}
.row.on b:before{transform:rotate(45deg)}
.row.on b:after{transform:rotate(-135deg)}
.go{left:60px;top:808px;width:636px;height:112px;border-radius:10px;background:#f4f4f1;color:#101114;font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center}
.back{left:96px;top:962px;font-size:28px;font-weight:600;color:rgba(244,244,241,.55)}
</style></head><body>
<img class="bg" src="assets/venue_dark.png" alt="">
<div class="shade"></div>
<div class="abs title">달리기</div>
<div class="abs rows">
 <div class="row on"><label>코스</label><b>2026 한국 대회장</b></div>
 <div class="row"><label>드라이버</label><b>미르 43</b></div>
 <div class="row"><label>방식</label><b>혼자</b></div>
 <div class="row"><label>시간</label><b class="num">90초</b></div>
 <div class="row"><label>상자</label><b class="num">3개</b></div>
</div>
<div class="abs go">출발</div>
<div class="abs back">뒤로</div>
</body></html>
