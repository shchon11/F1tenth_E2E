<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학습 차 실시간</title>
<style>
  /* Layout after the robotics/telemetry viewers it borrows from: one dominant top-down view whose camera follows the
     car (Foxglove 3D panel, Rerun's follow camera), beside it the reward's parts and the memory.
     (11-24, the user: "예측하는거나 좀 시각화도 더 예쁘게", "보상 항목도 좀 너무 별로", "일어난일은 왜있는거야") colour by
     entity, so the map needs no key: our car, its trail and its plan in one blue; the other car, its own plan and our
     prediction of it in one magenta; boxes amber; a plan that touches something in the critical red. Light and dark are
     each their own steps of the dataviz reference palette (validate_palette: blue / magenta / amber pass all-pairs on the
     lane colour in both modes). */
  :root {
    color-scheme: light;
    --page: #f3f3f0; --surface: #fcfcfb; --surface-2: #f0efec; --line: #e1e0d9; --grid: #ebeae5;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --lane: #fbfaf8; --wall: #d9d8d1; --band: #f2e4e1; --scan: #9ba2ac;
    --ego: #2a78d6; --opp: #cf4a86; --box: #c98500; --mem: #a66d00; --aqua: #1baf7a;
    --critical: #d03b3b; --warning: #fab219; --good: #0ca30c;
    --pos: #256abf; --neg: #c93b3a;
    --wall-hit: #e34948; --box-hit: #eda100; --wall-ink: #c93b3a; --box-ink: #8f6000;
    --veil: rgba(243, 243, 240, 0.55); --veil-box: rgba(252, 252, 251, 0.94);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0f12; --surface: #15181d; --surface-2: #1b1f25; --line: #2a2f37; --grid: #23272e;
      --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --lane: #20242b; --wall: #0b0c0e; --band: #3b2b2f; --scan: #6b7480;
      --ego: #3987e5; --opp: #d55181; --box: #c98500; --mem: #fab219; --aqua: #199e70;
      --pos: #5598e7; --neg: #e66767;
      --wall-hit: #e66767; --box-hit: #fab219; --wall-ink: #e66767; --box-ink: #fab219;
      --veil: rgba(13, 15, 18, 0.55); --veil-box: rgba(21, 24, 29, 0.92);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0f12; --surface: #15181d; --surface-2: #1b1f25; --line: #2a2f37; --grid: #23272e;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --lane: #20242b; --wall: #0b0c0e; --band: #3b2b2f; --scan: #6b7480;
    --ego: #3987e5; --opp: #d55181; --box: #c98500; --mem: #fab219; --aqua: #199e70;
    --pos: #5598e7; --neg: #e66767;
    --wall-hit: #e66767; --box-hit: #fab219; --wall-ink: #e66767; --box-ink: #fab219;
    --veil: rgba(13, 15, 18, 0.55); --veil-box: rgba(21, 24, 29, 0.92);
  }
  * { box-sizing: border-box; }
  /* 11-17 (the user: "지도 스크롤해야하는거 좆같음. 화면도 맞춰놓고. 그래프도 짤려서"): the page is exactly the window -- no page scroll;
     the map takes what is left of the height, every canvas is drawn at its own pixel size */
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  header { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  header .title { font-size: 15px; font-weight: 600; margin-right: 4px; }
  select, button { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font: inherit; }
  button { cursor: pointer; color: var(--ink-2); }
  button.on { color: var(--ink); border-color: var(--ego); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.live .dot { background: var(--good); }
  .pill.wait .dot { background: var(--warning); }
  .pill.scene { border-color: var(--warning); color: var(--ink); }
  .grow { flex: 1; }
  /* (11-17, the user: "update에 필요한 결정 수 비율이랑 현재 에피소드 진행 비율만 상단에") two progress pills */
  .prog { display: inline-flex; align-items: center; gap: 8px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .prog .bar { width: 120px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .prog .bar i { display: block; height: 100%; width: 0; background: var(--ego); border-radius: 3px; }
  .prog.ep .bar i { background: var(--aqua); }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 27vw, 440px); gap: 10px; padding: 10px 14px 12px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .mapwrap { position: relative; padding: 0; overflow: hidden; min-height: 0; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #map.drag { cursor: grabbing; }
  .hud { position: absolute; left: 14px; top: 12px; pointer-events: none; }
  .hud .v { font-size: 34px; font-weight: 600; line-height: 1; }
  .hud .u { font-size: 13px; color: var(--ink-2); margin-left: 4px; }
  .hud .sub { color: var(--ink-2); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .viewbar { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; align-items: center; }
  /* (11-17, the user: "update 반영중을 좀 지도 뿌옇게 하고 문구를 박아놔. 렉걸린줄 알잖아") between rollouts the car stands still on
     purpose: the map goes hazy and says so, with the seconds it has waited (no spinner: nothing on this page animates on its own) */
  #veil { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none;
          background: var(--veil); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  #veil.on { display: flex; }
  #veil div { padding: 14px 22px; border-radius: 10px; background: var(--veil-box); border: 1px solid var(--line);
              font-size: 20px; font-weight: 600; color: var(--ink); text-align: center; line-height: 1.35; font-variant-numeric: tabular-nums; }
  .side { min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
  /* (11-22, the user: "항목별 보상값들이라던지 아니면 좀 기억관련 좀 직관적이게") the reward's parts and what the memory thinks */
  #rwp, #memp { padding: 10px 12px 10px; }
  #rwp h3, #memp h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .rwt { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .rwt th { font-weight: 400; font-size: 12px; color: var(--muted); text-align: right; padding: 0 6px 4px; white-space: nowrap; }
  .rwt td { text-align: right; padding: 3px 6px; color: var(--ink); white-space: nowrap; border-top: 1px solid var(--grid); }
  .rwt tbody tr:first-child td { border-top: 0; }
  .rwt td.n { text-align: left; color: var(--ink-2); padding-left: 0; white-space: normal; }
  .rwt td.p { color: var(--pos); } .rwt td.m { color: var(--neg); } .rwt td.z { color: var(--muted); }
  .rwt td.b { width: 72px; padding: 0 0 0 6px; }
  .rwt th:last-child { padding-right: 0; }
  /* one quiet bar per part: this episode's sum, from the zero line (right = adds, left = takes away) */
  .rwt .bar { position: relative; display: block; height: 26px; }
  .rwt .bar::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .rwt .bar i { position: absolute; top: 10px; height: 6px; border-radius: 2px; }
  .rwt .bar i.p { background: var(--pos); } .rwt .bar i.m { background: var(--neg); }
  .rwt tr.tot td { border-top: 1px solid var(--ink-2); padding-top: 5px; font-weight: 600; font-size: 14px; }
  .rwt tr.tot td.n { color: var(--ink); }
  .laps, .memrow { font-size: 13px; color: var(--ink-2); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .empty { padding: 40px; color: var(--muted); text-align: center; }
  /* narrow screens: map on top (most of the height), the panels under it, the page scrolls there only */
  @media (max-width: 900px) {
    body { height: auto; overflow: auto; }
    main { grid-template-columns: 1fr; }
    .mapwrap { height: 62vh; }
    .side { overflow: visible; }
  }
  /* (11-20, the user: "저 이미지 추이들을 ... 실시간에다가 계속 업로드 ... 쭈르르륵 드래그하면 어디박았는지 볼 수 있게") the exam's
     collision map per checkpoint: the header button swaps the live view for it; one slider over the checkpoints (the runs it was
     continued from first), a strip of hard contacts per checkpoint above it (click a bar to jump), arrows step */
  #spots { display: none; grid-column: 1 / -1; min-height: 0; flex-direction: column; gap: 6px; padding: 8px 10px; }
  body.spotmode main > .mapwrap, body.spotmode main > .side { display: none; }
  body.spotmode #spots { display: flex; }
  /* (11-21, the user on the phone: "너무커") the map fits what is left of the screen under the controls, no page scroll; the
     live view's progress pills are hidden while the maps are shown */
  body.spotmode main { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  body.spotmode #spots { flex: 1; }
  body.spotmode header .pill, body.spotmode header .prog { display: none; }
  @media (max-width: 900px) { body.spotmode { height: 100vh; height: 100dvh; overflow: hidden; } }
  #b_spots.on, .viewbar button.on { color: var(--ink); border-color: var(--ink-2); }
  /* (11-21, the user: "이 그림에 빈 트랙에서 라인이랑 속도 어떻게 가져가는지도 같이 plot좀. 한바퀴 최고시간도") the map's line = the empty
     track's fastest lap, its speed in spots_frames.py's blue ramp (SPD, 1 -> 9 m/s) */
  .sp_spd { display: inline-block; width: 48px; height: 6px; border-radius: 3px; vertical-align: middle;
            background: linear-gradient(90deg, #7b3fe4, #4f6ef7, #2fa6f5, #5fe0f0, #e8fbff); }
  .sp_top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .sp_info { font-size: 14px; color: var(--ink); }
  .sp_info .m { color: var(--ink-2); }
  .sp_info .w { color: var(--wall-ink); } .sp_info .b { color: var(--box-ink); }
  .sp_body { flex: 1; min-height: 0; display: flex; justify-content: center; }
  .sp_body img { height: 100%; width: auto; max-width: 100%; object-fit: contain; border-radius: 6px; }
  #sp_strip { width: 100%; height: 92px; display: block; cursor: pointer; flex: none; }
  #sp_lap { width: 100%; height: 64px; display: block; cursor: pointer; flex: none; }
  #sp_slider { flex: none; }
  #sp_slider { width: 100%; accent-color: var(--ego); }
  .sp_ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <span class="title">학습 차 실시간</span>
  <select id="run" aria-label="학습"></select>
  <select id="car" aria-label="차" hidden></select>
  <span class="pill" id="status"><span class="dot"></span><span id="status_t">-</span></span>
  <span class="pill" id="upd">-</span>
  <span class="prog" id="p_upd">다음 update까지 <span class="bar"><i id="p_upd_b"></i></span><span id="p_upd_t">-</span></span>
  <span class="prog ep" id="p_ep">이 에피소드 <span class="bar"><i id="p_ep_b"></i></span><span id="p_ep_t">-</span></span>
  <span class="pill" id="ep">-</span>
  <span class="pill" id="opp">-</span>
  <span class="grow"></span>
  <button id="b_spots" title="시험(같은 128판)에서 세게 닿은 자리를 checkpoint마다 -- 슬라이더를 끌어 넘겨 봄">시험 충돌 지도</button>
</header>
<main>
  <section class="panel mapwrap">
    <canvas id="map"></canvas>
    <div class="hud"><div><span class="v" id="hud_v">-</span><span class="u">m/s</span></div>
      <div class="sub" id="hud_sub">-</div></div>
    <div id="veil"><div id="veil_t">update 반영 중</div></div>
    <div class="viewbar"><button id="v_follow" class="on">차 따라가기</button><button id="v_track">전체 트랙</button></div>
  </section>
  <section class="side">
    <!-- (11-22, the user: "필요한것만 넣어", "속도이런건 plot할 필요가 없자나", "항목별 보상값들 ... 기억관련 ... 직관적이게") -->
    <div class="panel" id="rwp" hidden><h3>보상 항목</h3>
      <table class="rwt"><thead><tr><th></th><th>최근 10초</th><th>이번 에피소드</th><th></th></tr></thead><tbody id="rw_b"></tbody></table>
      <div class="laps" id="laps"></div></div>
    <div class="panel" id="memp" hidden><h3>기억</h3><div id="mem_b"></div></div>
  </section>
  <section class="panel" id="spots">
    <div class="sp_top">
      <select id="sp_run" aria-label="시험 충돌 지도의 학습"></select>
      <button id="sp_prev" aria-label="앞 checkpoint">◀</button><button id="sp_next" aria-label="다음 checkpoint">▶</button>
      <span class="sp_info" id="sp_info">-</span>
    </div>
    <canvas id="sp_strip" aria-label="checkpoint별 세게 닿음 (세션당)"></canvas>
    <canvas id="sp_lap" aria-label="checkpoint별 빈 트랙 최고 한 바퀴"></canvas>
    <input type="range" id="sp_slider" min="0" max="0" step="1" value="0" aria-label="checkpoint">
    <div class="sp_ends"><span>2 <span class="sp_spd"></span> 9 m/s</span><span id="sp_first" hidden></span><span id="sp_last" hidden></span></div>
    <div class="sp_body"><img id="sp_img" alt="시험 충돌 지도"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const setText = (el, s) => { if (el.textContent !== s) el.textContent = s; };     // no re-layout when nothing changed
const C = {};
const TOKENS = ["page", "surface", "line", "grid", "ink", "ink-2", "muted", "lane", "wall", "band", "scan", "ego", "opp", "box", "mem",
                "critical", "warning", "wall-hit", "box-hit"];
function readTokens() { const cs = getComputedStyle(document.documentElement); for (const k of TOKENS) C[k] = cs.getPropertyValue("--" + k).trim(); }
readTokens();

let RUN = new URLSearchParams(location.search).get("run") || "", TRACK = {}, lastKey = null, CAR = "0";
let F0 = null, F1 = null, t1 = 0, dtF = 0.15;        // the two newest frames, for a smooth car between them
const PR = { H: 0, maxK: -1, prevK: null, epDec: null, trailLen: null };   // rollout length, this episode's decisions (null: unknown yet)

// ---------------------------------------------------------------- canvas at its own pixel size (no stretched text)
const DPR = () => window.devicePixelRatio || 1;
function fit(c) {
  const w = Math.max(1, c.clientWidth), h = Math.max(1, c.clientHeight), r = DPR();
  if (c.width !== Math.round(w * r) || c.height !== Math.round(h * r)) { c.width = Math.round(w * r); c.height = Math.round(h * r); }
  const g = c.getContext("2d"); g.setTransform(r, 0, 0, r, 0, 0);
  return { g, W: w, H: h };
}

// ---------------------------------------------------------------- drawing only when something changed
// (11-18) a map redrawn on every animation frame took 72 % of the display GPU, which also trains. (11-24) Now the map is drawn
// when a new decision arrives, then for the ~0.2 s that eases the car from the last pose to the new one (at most ~15 times a
// second), and on a zoom, drag or resize -- and not at all while the training is between rollouts.
let drawPending = false, lastDraw = 0;
function requestDraw() {
  if (drawPending) return;
  drawPending = true;
  setTimeout(() => requestAnimationFrame(() => { drawPending = false; frame().catch(() => {}); }), Math.max(0, 66 - (performance.now() - lastDraw)));
}

// ---------------------------------------------------------------- the map's camera: follow the car (default), or free
// wheel = zoom about the pointer, drag = move (leaves follow), double click = back to following, 전체 트랙 = the whole track
const VIEW = { mode: "follow", span: 9, cx: 0, cy: 0, ox: 0, oy: 0 };   // span: metres across the map's width; ox/oy: offset while following
let LAST = null;                                             // the last drawn camera {cx, cy, s, W, H, T}
const CAM = { x: 0, y: 0, t: 0 };                            // the following camera, eased toward the car
function setMode(m) { VIEW.mode = m; $("v_follow").className = m === "follow" ? "on" : ""; $("v_track").className = m === "track" ? "on" : ""; requestDraw(); }
function toggleFollow() {
  if (VIEW.mode === "follow") { if (LAST) { VIEW.cx = LAST.cx; VIEW.cy = LAST.cy; VIEW.span = LAST.W / LAST.s; } setMode("free"); }
  else { VIEW.ox = VIEW.oy = 0; VIEW.span = Math.min(VIEW.span, 14); setMode("follow"); }
}
$("v_follow").onclick = toggleFollow;
$("v_track").onclick = () => setMode("track");
(() => {
  const c = $("map");
  c.addEventListener("wheel", (e) => {
    e.preventDefault(); if (!LAST) return;
    const k = Math.exp(Math.max(-0.5, Math.min(0.5, e.deltaY * 0.0015)));
    const r = c.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const T = LAST.T, maxSpan = Math.max(T.W, T.H) * T.res * 1.6;
    const s0 = LAST.s, span1 = Math.max(1.2, Math.min(maxSpan, LAST.W / s0 * k)), s1 = LAST.W / span1;
    requestDraw();
    if (VIEW.mode === "follow") { VIEW.span = span1; return; }          // following: zoom only, the car stays in the middle
    // free / track: keep the point under the pointer where it is
    const wx = LAST.cx + (px - LAST.W / 2) / s0, wy = LAST.cy - (py - LAST.H / 2) / s0;
    VIEW.cx = wx - (px - LAST.W / 2) / s1; VIEW.cy = wy + (py - LAST.H / 2) / s1; VIEW.span = span1; setMode("free");
  }, { passive: false });
  let drag = null;
  c.addEventListener("pointerdown", (e) => { if (!LAST) return; drag = { x: e.clientX, y: e.clientY, cx: LAST.cx, cy: LAST.cy, ox: VIEW.ox, oy: VIEW.oy, s: LAST.s, moved: false }; c.setPointerCapture(e.pointerId); c.classList.add("drag"); });
  c.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 3) return;
    drag.moved = true; requestDraw();
    if (VIEW.mode === "follow") { VIEW.ox = drag.ox - dx / drag.s; VIEW.oy = drag.oy + dy / drag.s; return; }   // still following, just offset
    if (VIEW.mode === "track") { VIEW.span = LAST.W / drag.s; setMode("free"); }
    VIEW.cx = drag.cx - dx / drag.s; VIEW.cy = drag.cy + dy / drag.s;
  });
  const up = () => { drag = null; c.classList.remove("drag"); };
  c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
  c.addEventListener("dblclick", toggleFollow);
})();

function resetCar() { F0 = F1 = null; lastKey = null; PR.H = 0; PR.maxK = -1; PR.prevK = null; PR.epDec = null; PR.trailLen = null; }
// (11-22, the user: "이차밖에 못보나? 다른 차들을 볼 수 없나") the cars this run writes (plan_rl --live-taps), one picked at a time
async function loadCars() {
  if (!RUN) return;
  const r = await (await fetch(`/api/live_cars?run=${encodeURIComponent(RUN)}`, { cache: "no-store" })).json();
  const cs = r.cars || [], sel = $("car");
  sel.hidden = cs.length <= 1;
  const want = cs.map((c) => `${c.car}|${c.label}`).join(",");
  if (sel.dataset.cars !== want) {
    sel.dataset.cars = want;
    sel.innerHTML = cs.map((c) => `<option value="${c.car}">차 ${c.car + 1}${c.label ? " · " + c.label : ""}</option>`).join("");
  }
  if (!cs.some((c) => String(c.car) === CAR)) CAR = "0";
  sel.value = CAR;
  sel.onchange = () => { CAR = sel.value; resetCar(); };
}
async function loadRuns() {
  const r = await (await fetch("/api/live_runs")).json();
  const sel = $("run"); const cur = sel.value || RUN;
  const want = r.map((x) => x.name).join(",");
  if (sel.dataset.runs !== want) {                     // the list only when it changed (an open picker is not reset)
    sel.dataset.runs = want; sel.innerHTML = "";
    for (const x of r) { const o = document.createElement("option"); o.value = x.name; o.textContent = x.name; sel.appendChild(o); }
  }
  if (!r.length) return;
  RUN = r.some((x) => x.name === cur) ? cur : r[0].name; sel.value = RUN;
  sel.onchange = () => { RUN = sel.value; history.replaceState(null, "", "?run=" + RUN); CAR = "0"; resetCar(); loadCars().catch(() => {}); };
}

// the walls/lane image in the page's colours: the server sends three grey levels (lane, the car's half-width band along the
// walls, wall); the classes are kept to re-tint on a theme change and to test the plan's footprint against
function tint(t) {
  const cv = t.img || document.createElement("canvas"); cv.width = t.W; cv.height = t.H;
  const g = cv.getContext("2d"), d = g.createImageData(t.W, t.H), cols = [hex(C.lane), hex(C.band), hex(C.wall)];
  for (let i = 0, j = 0; j < t.mask.length; i += 4, j++) { const c = cols[t.mask[j]]; d.data[i] = c[0]; d.data[i + 1] = c[1]; d.data[i + 2] = c[2]; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); t.img = cv;
}
async function track(tid) {
  const k = RUN + ":" + tid;
  if (!TRACK[k]) {
    const t = await (await fetch(`/api/live_track?run=${encodeURIComponent(RUN)}&tid=${tid}`)).json();
    const im = new Image(); im.src = t.png; await im.decode();
    const cv = document.createElement("canvas"); cv.width = t.W; cv.height = t.H;
    const g = cv.getContext("2d"); g.drawImage(im, 0, 0);
    const d = g.getImageData(0, 0, t.W, t.H);
    // (11-18) lane 246, band 160, wall 70; the wall cells are what the plan's footprint is tested against, as the plan-hit cost does
    t.mask = new Uint8Array(t.W * t.H);
    for (let i = 0, j = 0; i < d.data.length; i += 4, j++) { const v = d.data[i]; t.mask[j] = v > 200 ? 0 : v > 110 ? 1 : 2; }
    t.img = cv; tint(t);
    t.car = t.car || [0.58, 0.31]; t.hit_s = t.hit_s || 1.0; t.hit_wall_s = t.hit_wall_s || t.hit_s;
    t.ext = {};                                       // each box shape's extent in its own frame
    for (const [id, fp] of Object.entries(t.fp || {})) {
      const xs = fp.map((q) => q[0]), ys = fp.map((q) => q[1]);
      t.ext[id] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
    }

  }

}
function hex(h) { const n = parseInt(h.replace("#", ""), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
// light / dark follow the device; a switch re-reads the colours, re-tints the tracks and redraws
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  readTokens(); for (const t of Object.values(TRACK)) tint(t); requestDraw(); if (SP.open) spStrip();
});

// ---------------------------------------------------------------- map
const lerp = (a, b, u) => a + (b - a) * u;
const lerpAng = (a, b, u) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * u; };
function pose(A, B, u) { return B ? [lerp(A[0], B[0], u), lerp(A[1], B[1], u), lerpAng(A[2], B[2], u), lerp(A[3], B[3], u)] : A; }
const okPts = (q) => Array.isArray(q) && q.length >= 2 && q.every((p) => Array.isArray(p) && isFinite(p[0]) && isFinite(p[1]));

// (11-18, the user: "plan이 ... 안붙이히게 그려도 ... 차 폭 고려할 때 부딧할 수 있는거잖아", "plan이 닿는걸 좀 보게") the driven
// plan's car body at every 0.025 s between its 0.1 s points, heading along the plan; the first pose whose body overlaps a wall
// (within the run's wall look-ahead) or a box (within its box look-ahead). The whole body, not only its corners: the
// training's plan-hit cost tests the four corners, which a box narrower than the car can pass between (dead centre) --
// measured on qual26b u300: it missed 12 of 680 on-path passes and none of the 24 hard hits
function planTouch(f, T, dims) {
  const Q = f.plan, n = Q.length; if (n < 2 || !T.mask) return { poses: [], hit: null };
  const hl = dims[0] / 2, hw = dims[1] / 2, SUB = 4;
  if (T.outlineKey !== dims.join()) {                 // the body's outline, a point every <= 5 cm
    const o = [], step = (a, b, m) => { for (let i = 0; i < m; i++) o.push([lerp(a[0], b[0], i / m), lerp(a[1], b[1], i / m)]); };
    const nl = Math.ceil(2 * hl / 0.05), nw = Math.ceil(2 * hw / 0.05);
    step([hl, hw], [hl, -hw], nw); step([hl, -hw], [-hl, -hw], nl); step([-hl, -hw], [-hl, hw], nw); step([-hl, hw], [hl, hw], nl);
    T.outline = o; T.outlineKey = dims.join();
  }
  const wallAt = (x, y) => {
    const ix = Math.floor((x - T.x0) / T.res), iy = Math.floor((T.y0 + T.H * T.res - y) / T.res);
    return ix < 0 || iy < 0 || ix >= T.W || iy >= T.H || T.mask[iy * T.W + ix] === 2;     // off the grid counts as a wall
  };
  const boxAt = (x, y) => f.boxes.some((b) => {
    const e = T.ext[String(b[0])]; if (!e) return false;
    const c = Math.cos(b[3]), s = Math.sin(b[3]), dx = x - b[1], dy = y - b[2], lx = c * dx + s * dy, ly = -s * dx + c * dy;
    return lx > e[0] && lx < e[1] && ly > e[2] && ly < e[3];
  });
  const head = (a, b, fb) => Math.hypot(b[0] - a[0], b[1] - a[1]) > 0.01 ? Math.atan2(b[1] - a[1], b[0] - a[0]) : fb;
  const poses = [[Q[0][0], Q[0][1], head(Q[0], Q[1], f.car[2]), 0.1]];
  for (let k = 1; k < n; k++) {
    const a = head(Q[k - 1], Q[k], poses[poses.length - 1][2]);
    for (let j = 1; j <= SUB; j++) { const u = j / SUB; poses.push([lerp(Q[k - 1][0], Q[k][0], u), lerp(Q[k - 1][1], Q[k][1], u), a, 0.1 * (k + u)]); }
  }
  // a box's corners inside the body (a box between the body's edges never has the body's outline in it)
  const boxIn = (p) => f.boxes.some((b) => {
    const e = T.ext[String(b[0])]; if (!e) return false;
    const cb = Math.cos(b[3]), sb = Math.sin(b[3]), c = Math.cos(p[2]), s = Math.sin(p[2]);
    return [[e[0], e[2]], [e[1], e[2]], [e[1], e[3]], [e[0], e[3]]].some(([u, v]) => {
      const dx = b[1] + u * cb - v * sb - p[0], dy = b[2] + u * sb + v * cb - p[1];
      return Math.abs(c * dx + s * dy) < hl && Math.abs(-s * dx + c * dy) < hw;
    });
  });
  let hit = null;
  for (const p of poses) {
    const c = Math.cos(p[2]), s = Math.sin(p[2]);
    const cs = [[hl, hw], [hl, -hw], [-hl, -hw], [-hl, hw]].map(([a, b]) => [p[0] + a * c - b * s, p[1] + a * s + b * c]);
    const ol = T.outline.map(([a, b]) => [p[0] + a * c - b * s, p[1] + a * s + b * c]);
    const w = p[3] <= T.hit_wall_s + 1e-6 && ol.some(([x, y]) => wallAt(x, y));
    const bx = p[3] <= T.hit_s + 1e-6 && (ol.some(([x, y]) => boxAt(x, y)) || boxIn(p));
    if (w || bx) { hit = { p, cs, kind: bx ? "box" : "wall" }; break; }
  }

}

// heading along a path at point k (from the point before it; the first from `fb`)
function headAt(Q, k, fb) {
  const a = k > 0 ? Q[k - 1] : null, b = Q[k];
  return a && Math.hypot(b[0] - a[0], b[1] - a[1]) > 0.01 ? Math.atan2(b[1] - a[1], b[0] - a[0]) : fb;
}

function drawMap(f, carP, oppP, T, trail) {
  const { g, W, H } = fit($("map"));
  g.fillStyle = C.wall; g.fillRect(0, 0, W, H);
  let cx, cy, span, moving = false;
  if (VIEW.mode === "follow") {
    // (11-17, the user: "차 따라가는거 뭐이리 어지럽냐 ... 머리아파") the car in the middle, north up, nothing else: the camera trails
    // the car by a quarter second so the wiggles of an early policy do not shake the whole map. A jump (a new episode) moves it at once.
    const tx = carP[0] + VIEW.ox, ty = carP[1] + VIEW.oy, now = performance.now();
    if (!CAM.t || Math.hypot(tx - CAM.x, ty - CAM.y) > 3 || now - CAM.t > 1000) { CAM.x = tx; CAM.y = ty; }
    else { const a = 1 - Math.exp(-(now - CAM.t) / 250); CAM.x += a * (tx - CAM.x); CAM.y += a * (ty - CAM.y); }
    CAM.t = now; cx = CAM.x; cy = CAM.y; span = VIEW.span;
    moving = Math.hypot(tx - CAM.x, ty - CAM.y) > 0.01;
  }
  else if (VIEW.mode === "track") { cx = T.x0 + T.W * T.res / 2; cy = T.y0 + T.H * T.res / 2; span = Math.max(T.W * T.res, T.H * T.res * W / H) * 1.05; }
  else { cx = VIEW.cx; cy = VIEW.cy; span = VIEW.span; }
  const s = W / span, P = (x, y) => [(x - cx) * s + W / 2, H / 2 - (y - cy) * s];
  LAST = Object.assign(LAST || {}, { cx, cy, s, W, H, T });
  const [ix, iy] = P(T.x0, T.y0 + T.H * T.res);
  g.imageSmoothingEnabled = s < 40; g.drawImage(T.img, ix, iy, T.W * T.res * s, T.H * T.res * s);
  g.lineCap = "round"; g.lineJoin = "round";
  const line = (pts, col, w, alpha, dash) => {
    g.save(); g.globalAlpha = alpha; g.setLineDash(dash || []); g.strokeStyle = col; g.lineWidth = w; g.beginPath();
    pts.forEach((q, i) => { const [x, y] = P(q[0], q[1]); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); g.restore();
  };
  const dot = (x, y, r, col, alpha, ring) => {
    g.save(); g.globalAlpha = alpha; g.beginPath(); g.arc(x, y, r, 0, 2 * Math.PI); g.fillStyle = col; g.fill();
    if (ring) { g.strokeStyle = C.surface; g.lineWidth = ring; g.stroke(); }
    g.restore();
  };
  // a car-sized body at a pose: true size, but never under 14 px long so it stays a shape when zoomed out
  const body = (st, dims) => {
    const k = Math.max(1, 14 / (dims[0] * s)), hl = dims[0] / 2 * k, hw = dims[1] / 2 * k;
    const c0 = Math.cos(st[2]), s0 = Math.sin(st[2]);
    return { c0, s0, hl, hw, at: (a, b) => P(st[0] + a * c0 - b * s0, st[1] + a * s0 + b * c0) };
  };
  const rect = (B, r) => {                          // a rounded rectangle in the body's frame (r in metres)
    const { hl, hw, at } = B, n = 3, pts = [];
    const corner = (cxm, cym, a0) => { for (let i = 0; i <= n; i++) { const a = a0 + i / n * Math.PI / 2; pts.push(at(cxm + r * Math.cos(a), cym + r * Math.sin(a))); } };
    corner(hl - r, hw - r, 0); corner(-hl + r, hw - r, Math.PI / 2); corner(-hl + r, -hw + r, Math.PI); corner(hl - r, -hw + r, 1.5 * Math.PI);
    g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
  };

  // LiDAR: quiet points

  for (const p of f.scan || []) { const [x, y] = P(p[0], p[1]); g.fillRect(x - ps / 2, y - ps / 2, ps, ps); }
  // boxes, each in its band of the car's half width (a stroke of the car's width centred on the outline), bands first
  const boxes = f.boxes || [];
  const boxPath = (b) => {
    const fp = T.fp[String(b[0])]; if (!fp) return false;
    const c0 = Math.cos(b[3]), s0 = Math.sin(b[3]);
    g.beginPath(); fp.forEach((q, i) => { const [x, y] = P(b[1] + q[0] * c0 - q[1] * s0, b[2] + q[0] * s0 + q[1] * c0); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.closePath(); return true;
  };

  for (const b of boxes) if (boxPath(b)) { g.fillStyle = C.box; g.fill(); }
  // the memory's read-out: where it thinks the boxes ahead are (dashed circles, stronger = surer)
  for (const b of f.mem_boxes || []) {

    g.save(); g.setLineDash([5, 4]); g.lineWidth = 2; g.globalAlpha = Math.min(1, 0.3 + b[0]); g.strokeStyle = C.mem;

  }

  for (let i = 1; i < trail.length; i++) {

  // 0.5 s and 1.0 s), as strong as the policy is sure it sees a car
  if (oppP && okPts(f.opp_plan)) line([[oppP[0], oppP[1]], ...f.opp_plan], C.opp, 1.5, 0.55);
  // (11-25, the user: faint pink with no car around) only when a car is in this race and the head says it sees one
  const pr = f.pred && okPts(f.pred.pts) && f.opp && (f.pred.p == null || +f.pred.p >= 0.5) ? f.pred : null;
  if (pr) {

      g.globalAlpha = a * pa; g.strokeStyle = C.opp; g.lineWidth = 1.5; g.stroke(); g.restore();
    }

      const u = Q.length > 1 ? k / (Q.length - 1) : 0, [x, y] = P(q[0], q[1]);
      dot(x, y, lerp(4.5, 2.25, u) * zf, C.opp, pa * lerp(1, 0.4, u), 1.5 * zf);

  // ---- our plans: the mean's thin dashes; the driven one with a tick every 0.1 s (longer at 0.5 s) and a dot at 1.0 s
  if (okPts(f.plan_mean)) line([[carP[0], carP[1]], ...f.plan_mean], C.ego, 1.5, 0.6, [5, 5]);
  const pt = planTouch(f, T, dims);
  const quad = (cs) => { g.beginPath(); cs.forEach(([x0, y0], i) => { const [x, y] = P(x0, y0); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); };
  const corners = (p) => {
    const c = Math.cos(p[2]), s0 = Math.sin(p[2]), hl = dims[0] / 2, hw = dims[1] / 2;
    return [[hl, hw], [hl, -hw], [-hl, -hw], [-hl, hw]].map(([a, b]) => [p[0] + a * c - b * s0, p[1] + a * s0 + b * c]);
  };
  if (s > 30) {                                       // close in: the body along the plan every 0.1 s, faint
    g.save(); g.globalAlpha = 0.22; g.strokeStyle = C.ego; g.lineWidth = 1;

  }
  const plan = f.plan;
  line([[carP[0], carP[1]], ...plan], C.ego, 3, 1);
  g.save(); g.strokeStyle = C.ego; g.lineWidth = 2; g.lineCap = "butt";
  plan.forEach((q, k) => {

  // ---- the cars, at their true size (the contact's and the plan-hit cost's footprint), a notch at the front
  const car = (st, d, col) => {
    const B = body(st, d);

    const { hl, hw, at } = B, tri = [at(hl * 0.78, 0), at(hl * 0.18, hw * 0.5), at(hl * 0.18, -hw * 0.5)];

  }

}

// ---------------------------------------------------------------- data
async function poll() {
  if (!RUN) return;
  let r;
  try { r = await fetch(`/api/live?run=${encodeURIComponent(RUN)}&car=${CAR}`, { cache: "no-store" }); } catch (e) { return; }
  if (!r.ok) return;
  const age = parseFloat(r.headers.get("X-Age") || "0");
  const live = age < 2;
  const stCls = "pill " + (live ? "live" : "wait"), vlCls = live ? "" : "on";
  if ($("status").className !== stCls) $("status").className = stCls;
  setText($("status_t"), live ? "실시간" : age < 300 ? `update 반영 중 · ${age.toFixed(0)}초` : `멈춤 · ${(age / 60).toFixed(0)}분 전`);
  if ($("veil").className !== vlCls) $("veil").className = vlCls;
  setText($("veil_t"), age < 300 ? `update 반영 중 · ${age.toFixed(0)}초` : "학습 멈춤");
  const d = await r.json(), f = d.now, key = f.upd * 100000 + f.k;
  if (key === lastKey) return;
  lastKey = key;
  // progress: decisions of this rollout out of the update's (the server's horizon; else the longest rollout seen) and the
  // episode's decisions out of its length (a replayed scene is shorter); an episode already running when we looked shows "-"
  const hH = parseInt(r.headers.get("X-Horizon") || "0"), epS = parseFloat(r.headers.get("X-Episode-S") || "40"), scS = parseFloat(r.headers.get("X-Scene-S") || "13");
  if (PR.prevK != null && f.k < PR.prevK) PR.maxK = Math.max(PR.maxK, PR.prevK);
  const H0 = hH > 0 ? hH : (PR.maxK >= 0 ? PR.maxK + 1 : 128);
  const H = H0 * Math.max(1, Math.ceil((f.k + 1) / H0));        // --horizon-auto grew the rollout since the last update's row
  // the episode's decisions: the tap's trail restarts with every episode and grows one point a decision (up to 80), so a
  // shorter trail than last time IS a new episode and, while it is under 80 points, its length is the exact count. The
  // one-decision new_ep flag alone was missed whenever the training wrote faster than this page polls (53.4/40 s, 11-17)
  const L = (d.trail || []).length;
  if (f.new_ep || (PR.trailLen != null && L < PR.trailLen) || L < 80) PR.epDec = Math.max(0, L - 1);
  else if (PR.epDec != null && PR.prevK != null) PR.epDec += f.k >= PR.prevK ? f.k - PR.prevK : f.k + 1;
  PR.prevK = f.k; PR.trailLen = L;
  const rk = Math.min(1, (f.k + 1) / H);
  $("p_upd_b").style.width = `${(100 * rk).toFixed(1)}%`; setText($("p_upd_t"), `${f.k + 1}/${H} 결정`);
  const epLen = (f.replay ? scS : epS) * 10;
  if (PR.epDec == null) { $("p_ep_b").style.width = "0%"; setText($("p_ep_t"), "-"); }
  else { const re = Math.min(1, PR.epDec / epLen); $("p_ep_b").style.width = `${(100 * re).toFixed(1)}%`; setText($("p_ep_t"), `${(PR.epDec / 10).toFixed(1)}/${(epLen / 10).toFixed(0)} 초`); }
  const t = f.t;
  if (F1 && t - F1.t < 3) dtF = Math.max(0.05, Math.min(0.5, 0.7 * dtF + 0.3 * (t - F1.t)));
  f.trail = d.trail || [];
  F0 = F1; F1 = f; t1 = performance.now();
  setText($("upd"), `update ${f.upd} · 결정 ${f.k}`);
  setText($("ep"), f.replay ? "장면 재생 중" : "일반 경주"); $("ep").className = "pill" + (f.replay ? " scene" : "");
  setText($("opp"), f.opp ? (f.copy ? "상대: 우리 policy 복제본" : "상대: 기존 상대 차") : "상대 차 없음");
  panels(f);
  setText($("hud_sub"), `plan 목표 ${f.plan_v[0].toFixed(1)} · 1초 뒤 ${f.plan_v[f.plan_v.length - 1].toFixed(1)} m/s`);
  requestDraw();
}

// the reward's parts (the tap sums them: the page polls slower than decisions come): every part by name with the last 10 s
// and this episode, the total under a rule; a bar per part for its episode sum, from a zero line, scaled to the largest part.
// `parts` = [{n, win, ep}, ..., {n: "합", ...}]; runs before it wrote the anonymous arrays parts_win / parts_ep
const OLD_PARTS = ["바퀴", "전진", "접촉", "박는 plan"];
function rewardRows(f) {
  if (Array.isArray(f.parts) && f.parts.length) {
    const rows = f.parts.filter((p) => p && p.n !== "합").map((p) => ({ n: String(p.n), win: +p.win || 0, ep: +p.ep || 0 }));
    const tot = f.parts.find((p) => p && p.n === "합");
    return { rows, tot: tot ? { win: +tot.win || 0, ep: +tot.ep || 0 }
                            : { win: rows.reduce((a, r) => a + r.win, 0), ep: rows.reduce((a, r) => a + r.ep, 0) } };
  }
  if (Array.isArray(f.parts_win) && Array.isArray(f.parts_ep)) {
    const n = f.parts_win.length - 1;
    const rows = f.parts_win.slice(0, n).map((w, i) => ({ n: OLD_PARTS[i] || `항목 ${i + 1}`, win: +w || 0, ep: +f.parts_ep[i] || 0 }));
    return { rows, tot: { win: +f.parts_win[n] || 0, ep: +f.parts_ep[n] || 0 } };
  }
  return null;
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const sgn = (v) => (Math.abs(v) < 0.005 ? "z" : v > 0 ? "p" : "m");
const num = (v) => (Math.abs(v) < 0.005 ? "0.00" : (v > 0 ? "+" : "−") + Math.abs(v).toFixed(2));
function panels(f) {
  const R = rewardRows(f);
  if (R) {
    const mx = Math.max(1e-9, ...R.rows.map((r) => Math.abs(r.ep)));
    const bar = (v) => {
      const w = Math.abs(v) < 0.005 ? 0 : Math.max(2, 50 * Math.abs(v) / mx);
      return w ? `<span class="bar"><i class="${v > 0 ? "p" : "m"}" style="left:${v > 0 ? 50 : 50 - w}%;width:${w.toFixed(1)}%"></i></span>` : `<span class="bar"></span>`;
    };
    const html = R.rows.map((r) => `<tr><td class="n">${esc(r.n)}</td><td class="${sgn(r.win)}">${num(r.win)}</td><td class="${sgn(r.ep)}">${num(r.ep)}</td><td class="b">${bar(r.ep)}</td></tr>`).join("")
      + `<tr class="tot"><td class="n">합</td><td class="${sgn(R.tot.win)}">${num(R.tot.win)}</td><td class="${sgn(R.tot.ep)}">${num(R.tot.ep)}</td><td></td></tr>`;
    if ($("rw_b").dataset.h !== html) { $("rw_b").dataset.h = html; $("rw_b").innerHTML = html; }
    setText($("laps"), (f.laps && f.laps.length ? "바퀴 시간 " + f.laps.map((x) => x.toFixed(1)).join(" · ") + " s" : "바퀴 시간 -") + (f.ep_s != null ? ` · 에피소드 ${f.ep_s.toFixed(0)} s` : ""));
    $("rwp").hidden = false;
  } else $("rwp").hidden = true;
  if (f.mem_boxes != null) {
    const mb = f.mem_boxes.filter((b) => b[0] >= 0.3);
    const html = (mb.length ? mb.map((b) => `<div class="memrow">${b[3].toFixed(1)} m 앞 · 확신 ${(100 * b[0]).toFixed(0)} %</div>`).join("") : `<div class="memrow">앞 12 m에 아는 상자 없음</div>`)
      + (f.known != null ? `<div class="memrow">이번 에피소드에 지나간 상자 ${f.known}개</div>` : "");
    if ($("mem_b").dataset.h !== html) { $("mem_b").dataset.h = html; $("mem_b").innerHTML = html; }
    $("memp").hidden = false;
  } else $("memp").hidden = true;
}
window.addEventListener("resize", requestDraw);

async function frame() {
  if (!F1) return;
  lastDraw = performance.now();
  const u = F0 ? Math.min(1, (lastDraw - t1) / (dtF * 1000)) : 1;
  const carP = F0 && !F1.new_ep ? pose(F0.car, F1.car, u) : F1.car;
  const oppP = F1.opp ? (F0 && F0.opp && !F1.new_ep ? pose(F0.opp, F1.opp, u) : F1.opp) : null;
  const T = TRACK[RUN + ":" + F1.tid] || await track(F1.tid);
  const moving = drawMap(F1, carP, oppP, T, F1.trail || []);
  setText($("hud_v"), carP[3].toFixed(1));
  $("hud_v").style.color = (F1.hit || []).some((x) => x > 0) ? C.critical : C.ink;
  if (u < 1 || moving) requestDraw();                  // easing toward the newest frame; idle once there
}

const SP = { frames: [], i: -1, run: "", open: false, imgs: {} };
async function spRuns() {
  const r = await (await fetch("/api/spots_runs", { cache: "no-store" })).json();
  const sel = $("sp_run"), cur = SP.run || RUN;
  sel.innerHTML = r.map((x) => `<option value="${x.name}">${x.name}</option>`).join("");
  SP.run = r.some((x) => x.name === cur) ? cur : (r[0] ? r[0].name : "");
  sel.value = SP.run;
}
async function spLoad(jumpLast) {
  if (!SP.run) return;
  const r = await (await fetch(`/api/spots?run=${encodeURIComponent(SP.run)}`, { cache: "no-store" })).json();
  const atLast = SP.i < 0 || SP.i >= SP.frames.length - 1;
  SP.frames = r.frames || [];
  for (const f of SP.frames) {                                   // preload: dragging must not wait for the network
    const k = `${f.run}/${f.u}/${f.mtime}`;
    if (!SP.imgs[k]) { const im = new Image(); im.src = `/file?path=spots/${f.run}/u${f.u}.png&v=${f.mtime}`; SP.imgs[k] = im; }
  }
  const sl = $("sp_slider");
  sl.max = Math.max(0, SP.frames.length - 1);
  if (jumpLast || atLast || SP.i >= SP.frames.length) SP.i = SP.frames.length - 1;
  $("sp_first").textContent = SP.frames.length ? `${SP.frames[0].run} u${SP.frames[0].u}` : "-";
  $("sp_last").textContent = SP.frames.length ? `${SP.frames[SP.frames.length - 1].run} u${SP.frames[SP.frames.length - 1].u}` : "-";
  spShow();
}
function spShow() {
  const f = SP.frames[SP.i];
  if (!f) { $("sp_info").textContent = "이 학습에는 아직 시험 기록이 없습니다"; $("sp_img").removeAttribute("src"); spStrip(); return; }
  $("sp_slider").value = SP.i;
  $("sp_img").src = `/file?path=spots/${f.run}/u${f.u}.png&v=${f.mtime}`;
  // (11-21, the user: "씨발좀 주저리주저리 쳐 써놓지좀 말라고") the checkpoint, its hard contacts and the empty track's best lap only
  $("sp_info").innerHTML = `<b>${f.run} u${f.u}</b> <span class="m">·</span> 세게 닿음 <b>${f.hard}</b> ` +
    `(<span class="w">벽 ${f.wall}</span> · <span class="b">상자 ${f.box}</span>${f.car ? ` · 차 ${f.car}` : ""})` +
    (f.best_lap != null ? ` <span class="m">·</span> 최고 한 바퀴 <b>${f.best_lap.toFixed(2)} s</b>` : "");
  spStrip();
}
// (11-21, the user: "표는 왜이렇게 좆같이 만들어놓은거야" -- four blocks filling the width, no numbers, no axis) one thin bar per
// checkpoint: hard contacts split into walls (red) and boxes (amber), its count above it, the update under it; the scale stops at
// a little over the usual worst so a collapse (hundreds) does not flatten the rest -- such a bar is drawn to the top with its count
const SPG = { padL: 10, padR: 10, top: 16, bot: 16 };
function spCell(w) { return (w - SPG.padL - SPG.padR) / Math.max(1, SP.frames.length); }
// (11-22, the user: "빈 트랙 최고 랩타임 추이 그래프로 있었으면 좋을듯") the empty track's best lap per checkpoint, in the bars'
// columns; down = faster. The first slow checkpoints would flatten the rest: the scale stops a little above the usual and such a
// point sits at the top with its value
function spLap() {
  const cv = $("sp_lap"), dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w) return;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const n = SP.frames.length, vs = SP.frames.map((f) => f.best_lap).filter((x) => x != null).sort((a, b) => a - b);
  if (!n || !vs.length) return;
  const cell = spCell(w), top = 18, H = h - top - 8, lo = vs[0], med = vs[Math.floor(0.5 * (vs.length - 1))];
  const hi = Math.max(lo + 0.6, lo + 2.5 * (med - lo)), every = Math.max(1, Math.ceil(40 / cell));
  const X = (k) => SPG.padL + cell * (k + 0.5), Y = (x) => top + H * (1 - (Math.min(x, hi) - lo) / (hi - lo));
  g.strokeStyle = C.ego; g.lineWidth = 2; g.lineJoin = "round"; g.beginPath();
  let pen = false;
  SP.frames.forEach((f, k) => {
    if (f.best_lap == null || (k > 0 && SP.frames[k - 1].run !== f.run)) pen = false;
    if (f.best_lap == null) return;
    if (pen) g.lineTo(X(k), Y(f.best_lap)); else g.moveTo(X(k), Y(f.best_lap));
    pen = true;
  });
  g.stroke();
  const kmin = SP.frames.findIndex((f) => f.best_lap === lo);
  g.font = "11px system-ui, -apple-system, sans-serif"; g.textAlign = "center"; g.textBaseline = "alphabetic";
  SP.frames.forEach((f, k) => {
    if (f.best_lap == null) return;
    const on = k === SP.i, x = X(k), y = Y(f.best_lap), up = f.best_lap > hi;
    g.fillStyle = on ? C.ink : C.ego; g.beginPath();
    if (up) { const r = on ? 5 : 4; g.moveTo(x, y - r); g.lineTo(x + r, y + r * 0.7); g.lineTo(x - r, y + r * 0.7); g.closePath(); }
    else g.arc(x, y, on ? 4 : 2.5, 0, 2 * Math.PI);                 // off the scale (slower than shown): a triangle at the top
    g.fill();
    if (on || (k === kmin && Math.abs(k - SP.i) > 1) || (up && k % every === 0)) {
      g.fillStyle = on ? C.ink : C["ink-2"];
      g.fillText(f.best_lap.toFixed(1) + (up ? "↑" : "") + (on ? " s" : ""), x, Math.max(11, y - 7));
    }
  });
}
function spStrip() {
  spLap();                                                         // the lap line under the bars is drawn with them
  const cv = $("sp_strip"), dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w) return;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const n = SP.frames.length; if (!n) return;
  const cell = spCell(w), bw = Math.min(14, Math.max(2, cell * 0.55)), y0 = h - SPG.bot, H = y0 - SPG.top;
  const srt = SP.frames.map((f) => f.hard).sort((a, b) => a - b);
  const cap = Math.max(10, 1.3 * srt[Math.floor(0.85 * (n - 1))]);
  const every = Math.max(1, Math.ceil(40 / cell));                 // labels every k-th bar so they do not overlap
  g.font = "11px system-ui, -apple-system, sans-serif"; g.textAlign = "center"; g.textBaseline = "alphabetic";
  g.strokeStyle = C.grid; g.lineWidth = 1; g.beginPath(); g.moveTo(SPG.padL, y0 + 0.5); g.lineTo(w - SPG.padR, y0 + 0.5); g.stroke();
  SP.frames.forEach((f, k) => {
    const cx = SPG.padL + cell * (k + 0.5), hh = Math.max(f.hard ? 2 : 0, H * Math.min(1, f.hard / cap));
    const hw = f.hard ? hh * f.wall / f.hard : 0, on = k === SP.i;
    g.globalAlpha = on ? 1 : 0.7;
    g.fillStyle = C["box-hit"]; g.fillRect(cx - bw / 2, y0 - hh, bw, hh - hw);
    g.fillStyle = C["wall-hit"]; g.fillRect(cx - bw / 2, y0 - hw, bw, hw);
    g.globalAlpha = 1;
    if (on || k % every === 0 || f.hard > cap) {
      g.fillStyle = on ? C.ink : C["ink-2"];
      g.fillText(String(f.hard) + (f.hard > cap ? "↑" : ""), cx, Math.max(SPG.top - 3, y0 - hh - 4));
    }
    if (on || k % every === 0) { g.fillStyle = on ? C.ink : C.muted; g.fillText(`u${f.u}`, cx, h - 3); }
    if (on) { g.strokeStyle = C.ink; g.lineWidth = 1.5; g.strokeRect(cx - bw / 2 - 3, SPG.top - 13, bw + 6, y0 - SPG.top + 13); }
    if (k > 0 && SP.frames[k - 1].run !== f.run) { g.fillStyle = C.muted; g.fillRect(SPG.padL + cell * k - 0.5, SPG.top - 12, 1, H + 12); }
  });
}
function spOpen(on) {
  SP.open = on; document.body.classList.toggle("spotmode", on); $("b_spots").classList.toggle("on", on);
  if (on) spRuns().then(() => spLoad(true)).catch(() => {});
}
$("b_spots").onclick = () => spOpen(!SP.open);
$("sp_run").onchange = () => { SP.run = $("sp_run").value; SP.i = -1; spLoad(true).catch(() => {}); };
$("sp_slider").oninput = () => { SP.i = +$("sp_slider").value; spShow(); };
$("sp_prev").onclick = () => { if (SP.i > 0) { SP.i--; spShow(); } };
$("sp_next").onclick = () => { if (SP.i < SP.frames.length - 1) { SP.i++; spShow(); } };
$("sp_strip").onclick = $("sp_lap").onclick = (e) => { const n = SP.frames.length; if (!n) return; SP.i = Math.min(n - 1, Math.max(0, Math.floor((e.offsetX - SPG.padL) / spCell($("sp_strip").clientWidth)))); spShow(); };
document.addEventListener("keydown", (e) => {
  if (!SP.open || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowLeft") { $("sp_prev").onclick(); e.preventDefault(); }
  if (e.key === "ArrowRight") { $("sp_next").onclick(); e.preventDefault(); }
});
window.addEventListener("resize", () => { if (SP.open) spStrip(); });
setInterval(() => { if (SP.open) spLoad(false).catch(() => {}); }, 60000);
if (new URLSearchParams(location.search).get("spots")) spOpen(true);

(async () => {
  await loadRuns();
  await loadCars().catch(() => {});
  if (!RUN) { document.querySelector("main").innerHTML = '<div class="empty">실시간 기록을 쓰는 학습이 없습니다 (plan_rl --live-tap)</div>'; return; }
  setInterval(() => poll().catch(() => {}), 100);
  setInterval(() => { loadRuns().catch(() => {}); loadCars().catch(() => {}); }, 20000);
})();
</script>
