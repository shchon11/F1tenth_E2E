<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학습 차 실시간</title>
<style>
  /* Layout after the robotics/telemetry viewers it borrows from: one dominant top-down view whose camera follows the
     car (Foxglove 3D panel, Rerun's follow camera), a small whole-track inset with the car on it (F1 live-timing track
     maps), and beside it time-series strips on ONE shared time axis with the events marked across all of them
     (Rerun timeline, Foxglove plot panel, Apollo Dreamview's PnC monitor). Colours: the dataviz reference palette's dark
     steps (validated: tools/../ dataviz validate_palette, dark, all checks pass). */
  :root {
    color-scheme: dark;
    --page: #0d0f12; --surface: #15181d; --surface-2: #1b1f25; --line: #2a2f37; --grid: #23272e;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --lane: #22272e; --wall: #0b0c0e; --scan: #6b7480;
    --s-car: #3987e5; --s-plan: #d95926; --s-mean: #199e70; --s-box: #c98500; --s-copy: #9085e9; --s-opp: #e66767;
    --critical: #d03b3b; --warning: #fab219;
  }
  * { box-sizing: border-box; }
  /* 11-17 (the user: "지도 스크롤해야하는거 좆같음. 화면도 맞춰놓고. 그래프도 짤려서"): the page is exactly the window -- no page scroll;
     the map takes what is left of the height, the four strips share the side column, every canvas is drawn at its own pixel size */
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
  header { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  header .title { font-size: 15px; font-weight: 600; margin-right: 4px; }
  select, button { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font: inherit; }
  button { cursor: pointer; color: var(--ink-2); }
  button.on { color: var(--ink); border-color: var(--s-car); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.live .dot { background: #0ca30c; }
  .pill.wait .dot { background: var(--warning); }
  .pill.scene { border-color: var(--warning); color: var(--ink); }
  .grow { flex: 1; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 27vw, 440px); gap: 10px; padding: 10px 14px 12px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .mapwrap { position: relative; padding: 0; overflow: hidden; min-height: 0; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #map.drag { cursor: grabbing; }
  .hud { position: absolute; left: 14px; top: 12px; pointer-events: none; }
  .hud .v { font-size: 34px; font-weight: 600; line-height: 1; }
  .hud .u { font-size: 13px; color: var(--ink-2); margin-left: 4px; }
  .hud .sub { color: var(--ink-2); margin-top: 6px; }
  .key { position: absolute; left: 14px; bottom: 10px; right: 230px; display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--ink-2); font-size: 12px; pointer-events: none; }
  .key i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .key i.box { width: 9px; height: 9px; border-radius: 2px; }
  #mini { position: absolute; right: 10px; top: 10px; width: 150px; height: 190px; border-radius: 8px; background: rgba(13,15,18,0.85); border: 1px solid var(--line); cursor: pointer; }
  .viewbar { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; align-items: center; }
  /* (11-17, the user: "update 반영중을 좀 지도 뿌옇게 하고 문구를 박아놔. 렉걸린줄 알잖아") between rollouts the car stands still on
     purpose: the map goes hazy and says so */
  #veil { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none;
          background: rgba(13, 15, 18, 0.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  #veil.on { display: flex; }
  #veil div { padding: 14px 22px; border-radius: 10px; background: rgba(21, 24, 29, 0.92); border: 1px solid var(--line);
              font-size: 20px; font-weight: 600; color: var(--ink); text-align: center; line-height: 1.35; }
  #veil small { display: block; font-size: 13px; font-weight: 400; color: var(--ink-2); }
  .side { min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .strip { flex: 1 1 0; min-height: 96px; display: flex; flex-direction: column; padding: 8px 10px 6px; }
  .strip h3 { margin: 0; font-size: 13px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; overflow: hidden; }
  .strip h3 .now { margin-left: auto; font-weight: 600; font-size: 15px; }
  .strip h3 .note { color: var(--muted); font-weight: 400; font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .strip .legend { display: flex; gap: 14px; color: var(--ink-2); font-size: 12px; margin-top: 1px; }
  .strip .legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; }
  .strip .cv { position: relative; flex: 1; min-height: 56px; margin-top: 4px; }
  .strip canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #events { flex: 0 0 132px; display: flex; flex-direction: column; padding: 8px 10px; }
  #events h3 { margin: 0 0 4px; font-size: 13px; }
  #evlist { flex: 1; min-height: 0; overflow: auto; font-size: 12px; }
  #evlist div { display: flex; gap: 10px; padding: 3px 0; border-top: 1px solid var(--grid); color: var(--ink-2); }
  #evlist .t { color: var(--muted); width: 64px; flex: none; font-variant-numeric: tabular-nums; }
  #evlist .crit { color: var(--ink); }
  #evlist .crit::before { content: "⚠"; color: var(--critical); margin-right: 4px; }
  .empty { padding: 40px; color: var(--muted); text-align: center; }
  /* narrow screens: map on top (most of the height), strips under it, the page scrolls there only */
  @media (max-width: 900px) {
    body { height: auto; overflow: auto; }
    main { grid-template-columns: 1fr; }
    .mapwrap { height: 62vh; }
    .strip { flex: none; height: 150px; }
    .key { right: 14px; bottom: 44px; }
  }
</style>
</head>
<body>
<header>
  <span class="title">학습 차 실시간</span>
  <select id="run" aria-label="학습"></select>
  <span class="pill" id="status"><span class="dot"></span><span id="status_t">-</span></span>
  <span class="pill" id="upd">-</span>
  <span class="pill" id="ep">-</span>
  <span class="pill" id="opp">-</span>
  <span class="grow"></span>
</header>
<main>
  <section class="panel mapwrap">
    <canvas id="map"></canvas>
    <div class="hud"><div><span class="v" id="hud_v">-</span><span class="u">m/s</span></div>
      <div class="sub" id="hud_sub">-</div></div>
    <canvas id="mini" width="300" height="380"></canvas>
    <div class="key">
      <span><i style="background:var(--s-car)"></i>우리 차 · 자취</span>
      <span><i style="background:var(--s-plan)"></i>실제로 몬 plan</span>
      <span><i style="background:var(--s-mean);height:2px"></i>평균 행동의 plan (잡음 없음)</span>
      <span class="k-opp"><i style="background:var(--s-opp)"></i>상대 차</span>
      <span class="k-opp"><i style="background:var(--s-copy)"></i>상대 = 우리 복제본</span>
      <span><i class="box" style="background:var(--s-box)"></i>상자</span>
    </div>
    <div id="veil"><div><span id="veil_t">update 반영 중</span><small id="veil_s"></small></div></div>
    <div class="viewbar"><button id="v_follow" class="on">차 따라가기</button><button id="v_track">전체 트랙</button></div>
  </section>
  <section class="side">
    <div class="panel strip"><h3>속도 <span class="note">m/s · 최근 20초</span><span class="now" id="now_v">-</span></h3>
      <div class="legend"><span><i style="background:var(--s-car)"></i>지금 속도</span><span><i style="background:var(--s-plan)"></i>plan이 1초 뒤에 낼 속도</span></div>
      <div class="cv"><canvas id="c_v"></canvas></div></div>
    <div class="panel strip"><h3>critic 값 <span class="note">앞으로 받을 보상의 예상</span><span class="now" id="now_val">-</span></h3>
      <div class="cv"><canvas id="c_val"></canvas></div></div>
    <div class="panel strip"><h3>plan이 바뀐 정도 <span class="note">m · 직전 결정의 plan과 같은 시각끼리</span><span class="now" id="now_pc">-</span></h3>
      <div class="cv"><canvas id="c_pc"></canvas></div></div>
    <div class="panel strip"><h3>기억 변화량 <span class="note">GRU 128개 평균 변화 · 결정마다</span><span class="now" id="now_mc">-</span></h3>
      <div class="cv"><canvas id="c_mc"></canvas></div></div>
    <div class="panel" id="events"><h3>일어난 일</h3><div id="evlist"></div></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const tok = (k) => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const C = {};
for (const k of ["page","surface","line","grid","ink","ink-2","muted","lane","wall","scan","s-car","s-plan","s-mean","s-box","s-copy","s-opp","critical","warning"]) C[k] = tok("--" + k);

const SPAN_S = 20;                                  // the strips show the last 20 s of decisions
let RUN = new URLSearchParams(location.search).get("run") || "", TRACK = {}, lastKey = null;
let F0 = null, F1 = null, t1 = 0, dtF = 0.15;        // the two newest frames, for a smooth car between them
const S = [];                                       // history: {t, v, vp, val, pc, mc}
const EV = [];                                      // events on the time axis: {t, kind}

// ---------------------------------------------------------------- canvas at its own pixel size (no stretched text)
const DPR = () => window.devicePixelRatio || 1;
function fit(c) {
  const w = Math.max(1, c.clientWidth), h = Math.max(1, c.clientHeight), r = DPR();
  if (c.width !== Math.round(w * r) || c.height !== Math.round(h * r)) { c.width = Math.round(w * r); c.height = Math.round(h * r); }
  const g = c.getContext("2d"); g.setTransform(r, 0, 0, r, 0, 0);
  return { g, W: w, H: h };
}

// ---------------------------------------------------------------- the map's camera: follow the car (default), or free
// wheel = zoom about the pointer, drag = move (leaves follow), double click = back to following, 전체 트랙 = the whole track
const VIEW = { mode: "follow", span: 9, cx: 0, cy: 0, ox: 0, oy: 0 };   // span: metres across the map's width; ox/oy: offset while following
let LAST = null;                                             // the last drawn camera {cx, cy, s, W, H, T}
function setMode(m) { VIEW.mode = m; $("v_follow").className = m === "follow" ? "on" : ""; $("v_track").className = m === "track" ? "on" : ""; }
function toggleFollow() {
  if (VIEW.mode === "follow") { if (LAST) { VIEW.cx = LAST.cx; VIEW.cy = LAST.cy; VIEW.span = LAST.W / LAST.s; } setMode("free"); }
  else { VIEW.ox = VIEW.oy = 0; VIEW.span = Math.min(VIEW.span, 14); setMode("follow"); }
}
$("v_follow").onclick = toggleFollow;
$("v_track").onclick = () => setMode("track");
(() => {
  const c = $("map");
  c.addEventListener("wheel", (e) => {
    e.preventDefault(); if (!LAST) return;
    const k = Math.exp(Math.max(-0.5, Math.min(0.5, e.deltaY * 0.0015)));
    const r = c.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const T = LAST.T, maxSpan = Math.max(T.W, T.H) * T.res * 1.6;
    const s0 = LAST.s, span1 = Math.max(1.2, Math.min(maxSpan, LAST.W / s0 * k)), s1 = LAST.W / span1;
    if (VIEW.mode === "follow") { VIEW.span = span1; return; }          // following: zoom only, the car stays in the middle
    // free / track: keep the point under the pointer where it is
    const wx = LAST.cx + (px - LAST.W / 2) / s0, wy = LAST.cy - (py - LAST.H / 2) / s0;
    VIEW.cx = wx - (px - LAST.W / 2) / s1; VIEW.cy = wy + (py - LAST.H / 2) / s1; VIEW.span = span1; setMode("free");
  }, { passive: false });
  let drag = null;
  c.addEventListener("pointerdown", (e) => { if (!LAST) return; drag = { x: e.clientX, y: e.clientY, cx: LAST.cx, cy: LAST.cy, ox: VIEW.ox, oy: VIEW.oy, s: LAST.s, moved: false }; c.setPointerCapture(e.pointerId); c.classList.add("drag"); });
  c.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 3) return;
    drag.moved = true;
    if (VIEW.mode === "follow") { VIEW.ox = drag.ox - dx / drag.s; VIEW.oy = drag.oy + dy / drag.s; return; }   // still following, just offset
    if (VIEW.mode === "track") { VIEW.span = LAST.W / drag.s; setMode("free"); }
    VIEW.cx = drag.cx - dx / drag.s; VIEW.cy = drag.cy + dy / drag.s;
  });
  const up = () => { drag = null; c.classList.remove("drag"); };
  c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
  c.addEventListener("dblclick", toggleFollow);
  // the inset: click a place to look there
  $("mini").addEventListener("click", (e) => {
    if (!LAST || !LAST.mini || VIEW.mode === "follow") return;
    const r = $("mini").getBoundingClientRect(), m = LAST.mini;
    VIEW.cx = m.T.x0 + (e.clientX - r.left - m.ox) / m.s; VIEW.cy = m.T.y0 + (m.sh * m.s - (e.clientY - r.top - m.oy)) / m.s;
    if (VIEW.mode !== "free") VIEW.span = Math.min(VIEW.span, 9);
    setMode("free");
  });
})();

async function loadRuns() {
  const r = await (await fetch("/api/live_runs")).json();
  const sel = $("run"); const cur = sel.value || RUN; sel.innerHTML = "";
  for (const x of r) { const o = document.createElement("option"); o.value = x.name; o.textContent = x.name; sel.appendChild(o); }
  if (!r.length) return;
  RUN = r.some((x) => x.name === cur) ? cur : r[0].name; sel.value = RUN;
  sel.onchange = () => { RUN = sel.value; history.replaceState(null, "", "?run=" + RUN); S.length = 0; EV.length = 0; F0 = F1 = null; lastKey = null; $("evlist").innerHTML = ""; };
}

async function track(tid) {
  const k = RUN + ":" + tid;
  if (!TRACK[k]) {
    const t = await (await fetch(`/api/live_track?run=${encodeURIComponent(RUN)}&tid=${tid}`)).json();
    // re-tint the walls/lane image to the page's colours once
    const im = new Image(); im.src = t.png; await im.decode();
    const cv = document.createElement("canvas"); cv.width = t.W; cv.height = t.H;
    const g = cv.getContext("2d"); g.drawImage(im, 0, 0);
    const d = g.getImageData(0, 0, t.W, t.H), L = hex(C.lane), Wl = hex(C.wall);
    for (let i = 0; i < d.data.length; i += 4) { const c = d.data[i] > 128 ? L : Wl; d.data[i] = c[0]; d.data[i + 1] = c[1]; d.data[i + 2] = c[2]; d.data[i + 3] = 255; }
    g.putImageData(d, 0, 0); t.img = cv; TRACK[k] = t;
  }
  return TRACK[k];
}
function hex(h) { const n = parseInt(h.replace("#", ""), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

function addEvent(text, crit) {
  const d = document.createElement("div");
  d.innerHTML = `<span class="t">${new Date().toLocaleTimeString("ko-KR", { hour12: false })}</span><span class="${crit ? "crit" : ""}">${text}</span>`;
  $("evlist").prepend(d); while ($("evlist").children.length > 80) $("evlist").lastChild.remove();
}

// ---------------------------------------------------------------- map
const lerp = (a, b, u) => a + (b - a) * u;
const lerpAng = (a, b, u) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * u; };
function pose(A, B, u) { return B ? [lerp(A[0], B[0], u), lerp(A[1], B[1], u), lerpAng(A[2], B[2], u), lerp(A[3], B[3], u)] : A; }

function drawMap(f, carP, oppP, T, trail) {
  const { g, W, H } = fit($("map"));
  g.fillStyle = C.wall; g.fillRect(0, 0, W, H);
  let cx, cy, span;
  if (VIEW.mode === "follow") { cx = carP[0] + 0.15 * VIEW.span * Math.cos(carP[2]) + VIEW.ox; cy = carP[1] + 0.15 * VIEW.span * Math.sin(carP[2]) + VIEW.oy; span = VIEW.span; }
  else if (VIEW.mode === "track") { cx = T.x0 + T.W * T.res / 2; cy = T.y0 + T.H * T.res / 2; span = Math.max(T.W * T.res, T.H * T.res * W / H) * 1.05; }
  else { cx = VIEW.cx; cy = VIEW.cy; span = VIEW.span; }
  const s = W / span, P = (x, y) => [(x - cx) * s + W / 2, H / 2 - (y - cy) * s];
  LAST = Object.assign(LAST || {}, { cx, cy, s, W, H, T });
  const [ix, iy] = P(T.x0, T.y0 + T.H * T.res);
  g.imageSmoothingEnabled = s < 40; g.drawImage(T.img, ix, iy, T.W * T.res * s, T.H * T.res * s);
  // LiDAR: quiet points
  g.fillStyle = C.scan;
  const ps = Math.max(1.5, Math.min(3.5, 0.03 * s));
  for (const p of f.scan || []) { const [x, y] = P(p[0], p[1]); g.fillRect(x - ps / 2, y - ps / 2, ps, ps); }
  // boxes
  for (const b of f.boxes) {
    const fp = T.fp[String(b[0])]; if (!fp) continue;
    const c0 = Math.cos(b[3]), s0 = Math.sin(b[3]);
    g.beginPath(); fp.forEach((q, i) => { const [x, y] = P(b[1] + q[0] * c0 - q[1] * s0, b[2] + q[0] * s0 + q[1] * c0); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.closePath(); g.fillStyle = C["s-box"]; g.fill();
  }
  // trail, fading into the past
  g.lineWidth = 3; g.lineCap = "round"; g.lineJoin = "round";
  for (let i = 1; i < trail.length; i++) {
    const [x0, y0] = P(trail[i - 1][0], trail[i - 1][1]), [x1, y1] = P(trail[i][0], trail[i][1]);
    g.globalAlpha = 0.12 + 0.6 * i / trail.length; g.strokeStyle = C["s-car"]; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
  }
  g.globalAlpha = 1;
  // plans: the mean's thin, the driven one on top
  const path = (pts, col, w, dash) => {
    g.setLineDash(dash || []); g.strokeStyle = col; g.lineWidth = w; g.beginPath();
    pts.forEach((q, i) => { const [x, y] = P(q[0], q[1]); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); g.setLineDash([]);
  };
  path(f.plan_mean, C["s-mean"], 2, [7, 6]);
  path(f.plan, C["s-plan"], 3);
  const end = f.plan[f.plan.length - 1], [ex, ey] = P(end[0], end[1]);
  g.fillStyle = C["s-plan"]; g.beginPath(); g.arc(ex, ey, 5, 0, 7); g.fill(); g.strokeStyle = C.surface; g.lineWidth = 2; g.stroke();
  // cars, 0.50 x 0.30 m
  const car = (st, col) => {
    const c0 = Math.cos(st[2]), s0 = Math.sin(st[2]), L = 0.25, Wd = 0.15;
    const q = [[L, Wd * 0.8], [L, -Wd * 0.8], [-L, -Wd], [-L, Wd]].map(([a, b]) => P(st[0] + a * c0 - b * s0, st[1] + a * s0 + b * c0));
    g.beginPath(); q.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
    g.fillStyle = col; g.fill(); g.strokeStyle = C.surface; g.lineWidth = 2; g.stroke();
  };
  if (oppP) car(oppP, f.copy ? C["s-copy"] : C["s-opp"]);
  car(carP, C["s-car"]);
  if (f.hit.some((x) => x > 0)) {
    const [x, y] = P(carP[0], carP[1]); g.strokeStyle = C.critical; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 0.55 * s, 0, 7); g.stroke();
  }
}

function drawMini(T, carP, oppP) {
  const { g, W, H } = fit($("mini"));
  g.clearRect(0, 0, W, H);
  const sw = T.W * T.res, sh = T.H * T.res, s = Math.min((W - 10) / sw, (H - 10) / sh);
  const ox = (W - sw * s) / 2, oy = (H - sh * s) / 2;
  g.drawImage(T.img, ox, oy, sw * s, sh * s);
  const P = (x, y) => [ox + (x - T.x0) * s, oy + sh * s - (y - T.y0) * s];
  // what the big map shows, as a frame
  if (LAST && LAST.s) {
    const [a, b] = P(LAST.cx - LAST.W / 2 / LAST.s, LAST.cy + LAST.H / 2 / LAST.s), [c2, d] = P(LAST.cx + LAST.W / 2 / LAST.s, LAST.cy - LAST.H / 2 / LAST.s);
    g.strokeStyle = C["ink-2"]; g.lineWidth = 1; g.strokeRect(a, b, c2 - a, d - b);
    LAST.mini = { T, s, ox, oy, sh };
  }
  const dot = (p, col) => { const [x, y] = P(p[0], p[1]); g.fillStyle = col; g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); g.strokeStyle = C.surface; g.lineWidth = 1.5; g.stroke(); };
  if (oppP) dot(oppP, C["s-opp"]);
  dot(carP, C["s-car"]);
}

// ---------------------------------------------------------------- strips (one time axis: now at the right edge)
function strip(id, series, opt) {
  const { g, W, H } = fit($(id)), padL = 40, padR = 6, padT = 6, padB = 16;
  g.clearRect(0, 0, W, H);
  const now = S.length ? S[S.length - 1].t : 0, t0 = now - SPAN_S;
  const vis = S.filter((r) => r.t >= t0);
  let vals = [];
  for (const s of series) for (const r of vis) { const v = r[s.key]; if (v != null && isFinite(v)) vals.push(v); }
  if (!vals.length) return;
  let lo = opt.lo != null ? Math.min(opt.lo, ...vals) : Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < (opt.minSpan || 1e-3)) { const m = (hi + lo) / 2; lo = m - (opt.minSpan || 1e-3) / 2; hi = m + (opt.minSpan || 1e-3) / 2; }
  const step = nice((hi - lo) / 3); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  if (opt.lo != null) lo = Math.max(lo, opt.lo);
  const X = (t) => padL + (t - t0) / SPAN_S * (W - padL - padR), Y = (v) => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  // grid + ticks
  g.font = "11px system-ui, sans-serif"; g.fillStyle = C.muted; g.strokeStyle = C.grid; g.lineWidth = 1;
  g.textAlign = "right"; g.textBaseline = "middle";
  const ny = Math.max(2, Math.min(4, Math.floor((H - padT - padB) / 22)));      // as many gridlines as the height carries
  const step2 = nice((hi - lo) / ny);
  for (let v = Math.ceil(lo / step2) * step2; v <= hi + 1e-9; v += step2) { const y = Math.round(Y(v)) + 0.5; g.beginPath(); g.moveTo(padL, y); g.lineTo(W - padR, y); g.stroke(); g.fillText(fmt(v, step2), padL - 5, y); }
  g.textAlign = "center"; g.textBaseline = "alphabetic";
  for (let k = 0; k <= SPAN_S; k += 5) { const x = X(t0 + k); g.fillText(k === SPAN_S ? "지금" : `${k - SPAN_S}초`, Math.max(padL + 12, Math.min(x, W - 16)), H - 3); }
  g.textAlign = "left";
  // events across the strip: hard contacts (critical), new episodes (dashed)
  for (const e of EV) {
    if (e.t < t0) continue; const x = Math.round(X(e.t)) + 0.5;
    g.strokeStyle = e.kind === "hit" ? C.critical : C.muted; g.lineWidth = e.kind === "hit" ? 1.5 : 1; g.setLineDash(e.kind === "hit" ? [] : [3, 3]);
    g.beginPath(); g.moveTo(x, padT); g.lineTo(x, H - padB); g.stroke(); g.setLineDash([]);
  }
  for (const s of series) {
    g.strokeStyle = s.col; g.lineWidth = 2; g.lineJoin = "round"; g.lineCap = "round"; g.beginPath();
    let on = false, prevT = null;
    for (const r of vis) {
      const v = r[s.key];
      if (v == null || !isFinite(v) || (prevT != null && r.t - prevT > 1.0)) { on = false; prevT = r.t; if (v == null) continue; }
      const x = X(r.t), y = Y(v); on ? g.lineTo(x, y) : g.moveTo(x, y); on = true; prevT = r.t;
    }
    g.stroke();
  }
}
function nice(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= x) return m * p; return 10 * p; }
function fmt(v, step) { return step >= 1 ? v.toFixed(0) : step >= 0.1 ? v.toFixed(1) : step >= 0.01 ? v.toFixed(2) : v.toFixed(3); }

// ---------------------------------------------------------------- data
let tick0 = performance.now();
async function poll() {
  if (!RUN) return;
  let r;
  try { r = await fetch(`/api/live?run=${encodeURIComponent(RUN)}`, { cache: "no-store" }); } catch (e) { return; }
  if (!r.ok) return;
  const age = parseFloat(r.headers.get("X-Age") || "0");
  const live = age < 2;
  $("status").className = "pill " + (live ? "live" : "wait");
  $("status_t").textContent = live ? "실시간" : age < 300 ? `update 반영 중 · ${age.toFixed(0)}초` : `멈춤 · ${(age / 60).toFixed(0)}분 전`;
  $("veil").className = live ? "" : "on";
  $("veil_t").textContent = age < 300 ? "update 반영 중" : "학습 멈춤";
  $("veil_s").textContent = age < 300 ? `모은 주행으로 신경망을 고치는 중 · ${age.toFixed(0)}초째 (끝나면 다시 달림)` : `마지막 기록 ${(age / 60).toFixed(0)}분 전`;
  const d = await r.json(), f = d.now, key = f.upd * 100000 + f.k;
  if (key === lastKey) return;
  lastKey = key;
  const t = f.t;
  if (F1 && t - F1.t < 3) dtF = Math.max(0.05, Math.min(0.5, 0.7 * dtF + 0.3 * (t - F1.t)));
  F0 = F1; F1 = f; t1 = performance.now();
  if (f.new_ep) { EV.push({ t, kind: "ep" }); addEvent(f.replay ? "새 에피소드: 장면 재생 (예전에 세게 닿은 장면)" : "새 에피소드: 일반 경주", false); }
  const kinds = ["벽", "상자", "상대 차"];
  f.hit.forEach((h, i) => { if (h > 0) { EV.push({ t, kind: "hit" }); addEvent(`${kinds[i]}에 세게 닿음 · ${f.car[3].toFixed(1)} m/s`, true); } });
  S.push({ t, v: f.car[3], vp: f.plan_v[9], val: f.value, pc: f.plan_change, mc: f.mem_change });
  while (S.length && S[0].t < t - SPAN_S - 2) S.shift();
  while (EV.length && EV[0].t < t - SPAN_S - 2) EV.shift();
  $("upd").textContent = `update ${f.upd} · 결정 ${f.k}`;
  $("ep").textContent = f.replay ? "장면 재생 중" : "일반 경주"; $("ep").className = "pill" + (f.replay ? " scene" : "");
  $("opp").textContent = f.opp ? (f.copy ? "상대: 우리 policy 복제본" : "상대: 기존 상대 차") : "상대 차 없음";
  for (const k of document.querySelectorAll(".k-opp")) k.style.display = f.opp ? "" : "none";   // a solo run has no opponents to key
  $("now_v").textContent = f.car[3].toFixed(2); $("now_val").textContent = f.value.toFixed(2);
  $("now_pc").textContent = f.plan_change == null ? "-" : f.plan_change.toFixed(2);
  $("now_mc").textContent = f.mem_change == null ? "-" : f.mem_change.toFixed(3);
  $("hud_sub").textContent = `plan 목표 ${f.plan_v[0].toFixed(1)} · 1초 뒤 ${f.plan_v[9].toFixed(1)} m/s`;
  F1.trail = d.trail;
  strips();
}
function strips() {
  strip("c_v", [{ key: "v", col: C["s-car"] }, { key: "vp", col: C["s-plan"] }], { lo: 0, minSpan: 2 });
  strip("c_val", [{ key: "val", col: C["s-car"] }], { minSpan: 0.2 });
  strip("c_pc", [{ key: "pc", col: C["s-car"] }], { lo: 0, minSpan: 0.1 });
  strip("c_mc", [{ key: "mc", col: C["s-car"] }], { lo: 0, minSpan: 0.01 });
}
window.addEventListener("resize", () => { try { strips(); } catch (e) {} });

async function frame() {
  if (F1) {
    const u = F0 ? Math.min(1, (performance.now() - t1) / (dtF * 1000)) : 1;
    const carP = F0 && !F1.new_ep ? pose(F0.car, F1.car, u) : F1.car;
    const oppP = F1.opp ? (F0 && F0.opp && !F1.new_ep ? pose(F0.opp, F1.opp, u) : F1.opp) : null;
    const T = TRACK[RUN + ":" + F1.tid] || await track(F1.tid);
    drawMap(F1, carP, oppP, T, F1.trail || []);
    drawMini(T, carP, oppP);
    $("hud_v").textContent = carP[3].toFixed(1);
    $("hud_v").style.color = F1.hit.some((x) => x > 0) ? C.critical : C.ink;
  }
  requestAnimationFrame(() => frame().catch(() => requestAnimationFrame(frame)));
}

(async () => {
  await loadRuns();
  if (!RUN) { document.querySelector("main").innerHTML = '<div class="empty">실시간 기록을 쓰는 학습이 없습니다 (plan_rl --live-tap)</div>'; return; }
  setInterval(() => poll().catch(() => {}), 100);
  setInterval(() => loadRuns().catch(() => {}), 20000);
  frame();
})();
</script>
